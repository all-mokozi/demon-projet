<nav class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="!activePrecedent">
            <a class="page-link" href="javascript:void(0)"
              (click)="onPaginate(currentPage - 1)">Précédent</a>
          </li>
          @for(indexpage of pages; track indexpage){
          <li class="page-item" [class.active]="indexpage === currentPage">
            <a class="page-link" href="javascript:void(0)" (click)="onPaginate(indexpage)">{{indexpage}}</a>
          </li>
          }

          <li class="page-item" [class.disabled]="!activeSuivant">
            <a class="page-link" href="javascript:void(0)"
              (click)="onPaginate(currentPage + 1)">Suivant</a>
          </li>
        </ul>
      </nav>
