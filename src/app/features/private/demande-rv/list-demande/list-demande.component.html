<div class="container-fluid p-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-list"></i> {{title}}</h2>
    <a class="btn btn-primary" routerLink="/form-demande">
      <i class="bi bi-plus-circle"></i> Nouvelle Demande
    </a>
  </div>
  <!-- two-way data binding pour le titre de la page avec le ngmodel -->
  <!-- <input type="text" [(ngModel)]="title" class="form-control mb-4" > -->
  <!-- Filters -->
  <div class="card shadow-sm mb-4 border-start border-0 border-primary">

    <div class="card-body">
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label text-muted">Filtrer par statut</label>
          <select class="form-select" [(ngModel)]="filter.statut" id="filterStatus"
            (change)="onFilterStatutAndSpecialityChange()">

            <option value="">Tous les statuts</option>
            <option value="En attente">En attente</option>
            <option value="Acceptée">Acceptée</option>
            <option value="Refusée">Refusée</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label text-muted">Filtrer par spécialité</label>
          <select class="form-select" [(ngModel)]="filter.specialite" (change)=" onFilterStatutAndSpecialityChange()"
            id="filterSpeciality">
            <option value="">Toutes les spécialités</option>
            <option value="Cardiologie">Cardiologie</option>
            <option value="Dermatologie">Dermatologie</option>
            <option value="Neurologie">Neurologie</option>
            <option value="Pédiatrie">Pédiatrie</option>
            <option value="Radiologie">Radiologie</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card shadow-sm border-start border-0 border-primary">
    <div class="card-body p-0">
      @if(demandesResponse && demandesResponse.data && demandesResponse.data.length > 0){
      <div class="table-responsive">

        <table class="table table-hover mb-0">

          <thead class="table-light">
            <tr>
              <th>Spécialité</th>
              <th><i class="bi bi-calendar"></i> Date Demandée</th>
              <th><i class="bi bi-clock"></i> Heure</th>
              <th><i class="bi bi-info-circle"></i> Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            @for(demandes of demandesResponse.data ; track demandes.id){
            <tr>
              <td class="align-middle">{{demandes.specialite}}</td>
              <td class="align-middle">{{demandes.dateDemande}}</td>
              <td class="align-middle">{{demandes.heure}}</td>
              <td >
                <app-badge [statut]="demandes.statut"></app-badge>
                

                <!-- @switch(demandes.statut){
                @case('Acceptée'){
                <span class="badge bg-success">
                  <i class="bi bi-check-circle"></i> {{demandes.statut}}
                </span>
                }
                @case('Refusée'){
                <span class="badge bg-danger">
                  <i class="bi bi-x-circle"></i> {{demandes.statut}}
                </span>
                }
                @default{
                <span class="badge bg-warning text-dark">
                  <i class="bi bi-clock"></i> {{demandes.statut}}
                </span>

                }
                } -->
                <!-- @if($demandes.statut === 'Acceptée'){
                <span class="badge bg-success">
                  <i class="bi bi-check-circle"></i> {{$demandes.statut}}
                </span>
                }@else if($demandes.statut === 'Refusée'){
                <span class="badge bg-danger">
                  <i class="bi bi-x-circle"></i> {{$demandes.statut}}
                </span>
                }@else{
                <span class="badge bg-warning text-dark">
                  <i class="bi bi-clock"></i> {{$demandes.statut}}

                </span>

                } -->

              </td>
              <td class="align-middle">
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i> Voir
                </button>
              </td>
            </tr>
            }

            <!-- @empty{
            <tr>
              <td colspan="5" class="text-center text-muted py-4">
                <i class="bi bi-inbox"></i> Aucune demande de rendez-vous trouvée.
              </td>
            </tr>

            } -->



          </tbody>
        </table>
      </div>
      <!-- Pagination -->
      <app-pagination *ngIf="demandesResponse"
        [currentPage]="demandesResponse.currentPage"
        
        [pages]="demandesResponse.pages"
        (pageChange)="onPaginate($event)">
      </app-pagination>

      
      }@else{
      <div class="p-4">
        <app-alert [message]="'Aucune demande de rendez-vous trouvée.'" [type]="'danger'"></app-alert>
      </div>

      }



    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
