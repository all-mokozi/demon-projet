
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm border-0" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">

            <!-- Icon -->
            <div class="d-flex justify-content-center mb-3">
                <div class="rounded-circle bg-primary bg-opacity-25 d-flex align-items-center justify-content-center"
                     style="width: 90px; height: 90px;">
                    <i class="bi bi-hospital text-primary fs-1"></i>
                </div>
            </div>

            <!-- Welcome -->
            <p class="text-center text-muted mb-1 small">Bienvenue sur</p>

            <!-- System title -->
            <p class="text-center text-primary fw-semibold small mb-4">
                Système de Gestion de Rendez-vous Médicaux
            </p>

            <!-- Main title -->
            <h5 class="text-center mb-4">Se connecter</h5>

            <!-- Form -->
            <form>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Login</label>
                    <input type="text" class="form-control" placeholder="Email ou nom d'utilisateur">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <input type="password" class="form-control" placeholder="Mot de passe">
                    <div class="text-end mt-1">
                        <a href="#" class="link-primary small">Mot de passe oublié ?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                    Se connecter
                </button>

            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Pas encore inscrit ?
                <a href="#" class="link-primary fw-semibold">S'inscrire</a>
            </p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
