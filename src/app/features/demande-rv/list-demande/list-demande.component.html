<div class="container-fluid p-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-list"></i> Mes Demandes de RV</h2>
    <a class="btn btn-primary">
      <i class="bi bi-plus-circle"></i> Nouvelle Demande
    </a>
  </div>

  <!-- Filters -->
  <div class="card shadow-sm mb-4 border-start border-0 border-primary">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label text-muted">Filtrer par statut</label>
          <select class="form-select">
            <option>Tous les statuts</option>
            <option>En attente</option>
            <option>Accepté</option>
            <option>Annulé</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label text-muted">Filtrer par spécialité</label>
          <select class="form-select">
            <option>Toutes les spécialités</option>
            <option>Cardiologie</option>
            <option>Dermatologie</option>
            <option>Neurologie</option>
            <option>Pédiatrie</option>
            <option>Radiologie</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="card shadow-sm border-start border-0 border-primary">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Spécialité</th>
              <th><i class="bi bi-calendar"></i> Date Demandée</th>
              <th><i class="bi bi-clock"></i> Heure</th>
              <th><i class="bi bi-info-circle"></i> Statut</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="align-middle">Cardiologie</td>
              <td class="align-middle">10/02/2026</td>
              <td class="align-middle">14:30</td>
              <td class="align-middle">
                <span class="badge bg-warning text-dark">
                  <i class="bi bi-clock"></i> En attente
                </span>
              </td>
              <td class="align-middle">
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i> Voir
                </button>
              </td>
            </tr>

            <tr>
              <td class="align-middle">Dermatologie</td>
              <td class="align-middle">12/02/2026</td>
              <td class="align-middle">09:00</td>
              <td class="align-middle">
                <span class="badge bg-success text-white">
                  <i class="bi bi-check-circle"></i> Accepté
                </span>
              </td>
              <td class="align-middle">
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i> Voir
                </button>
              </td>
            </tr>

            <tr>
              <td class="align-middle">Radiologie</td>
              <td class="align-middle">08/02/2026</td>
              <td class="align-middle">16:00</td>
              <td class="align-middle">
                <span class="badge bg-danger text-white">
                  <i class="bi bi-x-circle"></i> Annulé
                </span>
              </td>
              <td class="align-middle">
                <button class="btn btn-sm btn-outline-primary me-1">
                  <i class="bi bi-eye"></i> Voir
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <nav class="mt-4">
        <ul class="pagination justify-content-center">
          <li class="page-item">
            <a class="page-link">Précédent</a>
          </li>
          <li class="page-item active">
            <a class="page-link">1</a>
          </li>
          <li class="page-item">
            <a class="page-link">2</a>
          </li>
          <li class="page-item">
            <a class="page-link">Suivant</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
